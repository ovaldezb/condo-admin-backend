[project]
name = "condo-core"
version = "0.1.0"
description = "Paquete común de los módulos de condo-admin: autenticación, tenancy, MongoDB, logs y errores"
requires-python = "==3.12.*"
dependencies = [
    "aws-lambda-powertools>=3.0",
    "pydantic>=2.8",
    "pymongo[aws]>=4.9",
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/condo_core"]
