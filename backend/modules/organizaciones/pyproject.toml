[project]
name = "organizaciones"
version = "0.1.0"
description = "Módulo organizaciones de condo-admin (exclusivo de SUPER_ADMIN)"
requires-python = "==3.12.*"
dependencies = [
    "condo-core",
    "email-validator>=2.2",
]

[tool.uv.sources]
condo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/organizaciones"]
