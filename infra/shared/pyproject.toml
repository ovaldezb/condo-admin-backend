[project]
name = "cognito-triggers"
version = "0.1.0"
description = "Disparadores de Cognito de condo-admin (Pre Token Generation V2)"
requires-python = "==3.12.*"
dependencies = [
    "condo-core",
]

[tool.uv.sources]
condo-core = { path = "../../backend/core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cognito_triggers"]
exclude = ["src/cognito_triggers/tests"]

[tool.coverage.run]
omit = ["*/tests/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "moto[cognitoidp,s3]>=5.0",
    "testcontainers[mongodb]>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["condo_core", "organizaciones", "cognito_triggers", "seed_catalogos", "crear_super_admin"]

[tool.ruff.lint.per-file-ignores]
# Las pruebas usan asserts y credenciales ficticias contra moto.
"**/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# Estas bibliotecas no publican tipos.
module = ["boto3", "boto3.*", "botocore", "botocore.*", "moto", "moto.*"]
ignore_missing_imports = true
